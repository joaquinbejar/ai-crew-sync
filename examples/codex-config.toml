# The bus procedures (catch up, claim, hand off, review…) are prose recipes:
# `ai-crew-sync recipes <name>`, or recipes/<name>.md in the ai-crew-sync repo.
# Point AGENTS.md at them so Codex follows the same moves as the Claude plugin.
# ~/.codex/config.toml, or <repo>/.codex/config.toml in a trusted project.
#
# Codex starts the binary, which connects to the bus as one authenticated
# session per conversation. No token lives in this file: the proxy resolves
# one from your local profiles (`ai-crew-sync context profile add`), and
# `ai-crew-sync context show` says which one applies where you are.
[mcp_servers.ai-crew-sync]
command = "ai-crew-sync"
args = ["mcp", "proxy"]
# Let one wait_for_updates call cover a long idle stretch (the proxy accepts
# timeout_seconds up to 1800). Codex cuts a tool call at 60 s by default, and
# an agent that re-asks every minute spends a model turn, and tokens, each time.
tool_timeout_sec = 1900

# Optional: the role every window started from this config announces, so
# teammates can find it with list_sessions. The project label normally comes
# from the repository's .acs.toml instead.
# args = ["mcp", "proxy", "--role", "review"]

# Installed as the Codex plugin instead (marketplace ai-crew-sync), the same
# setting goes on the plugin's server:
# [plugins."ai-crew-sync@ai-crew-sync".mcp_servers.ai-crew-sync]
# tool_timeout_sec = 1900

# Waking an idle thread: Codex has no hook that can start a turn, so a message
# for a thread whose turn ended waits for its human. The opt-in adapter starts
# one through the local Codex app-server, for one thread, as that thread's own
# window: `ai-crew-sync context codex-wake --thread <thread-id>`. Nothing here
# turns it on; see docs/adapters/codex-wake.md.
