[package]
name = "ai-crew-sync"
version = "0.6.2"
edition = "2024"
rust-version = "1.97.1"
description = "MCP server that lets a team's AI coding agents (Claude Code, Codex, Cursor or any MCP client) exchange messages, coordinate tasks, share presence and keep shared notes, backed by Postgres"
license = "MIT"
repository = "https://github.com/joaquinbejar/ai-crew-sync"
readme = "README.md"
keywords = ["mcp", "claude", "agents", "coordination", "postgres"]
categories = ["development-tools", "web-programming::http-server", "asynchronous"]

[[bin]]
name = "ai-crew-sync"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "server-side-http",
    "tower",
    # client side, for `ai-crew-sync client ...`
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1.2"

axum = "0.8"
# 0.6, not the newer 0.7. reqwest — which rmcp resolves and which the webhook
# dispatcher shares — is on 0.6, so taking 0.7 here compiles a second copy of
# the same middleware crate into the binary for nothing. Checked with
# `cargo tree -d`: this pin removes a duplicate, where bumping base64 and sha2
# does not (rmcp and sqlx-postgres already force the newer ones regardless).
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
http = "1.5"

tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

sha2 = "0.11"
rand = "0.10"
hex = "0.4"
base64 = "0.23"

# Outgoing webhooks. Kept on the same major as the reqwest rmcp resolves,
# so the binary carries one HTTP client and one TLS stack, not two.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "rustls"] }
base64 = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# ---------------------------------------------------------------- packaging --
# `.deb` and `.rpm` are built from the musl binary, so neither declares a
# runtime dependency: the artifact is statically linked and the crate pulls in
# no C libraries (rustls rather than OpenSSL, and sqlx speaks the Postgres
# protocol in Rust). That is why the dependency lists below are empty rather
# than merely short.

[package.metadata.deb]
maintainer = "Joaquin Bejar <jb@taunais.com>"
copyright = "2026, Joaquin Bejar <jb@taunais.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
Coordination bus between a team's AI coding agents — Claude Code, Codex, \
Cursor or any MCP client — with all state in PostgreSQL. Ships the server, \
the operator CLI and the console client in one binary."""
section = "utils"
priority = "optional"
depends = ""
assets = [
    ["target/release/ai-crew-sync", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ai-crew-sync/README.md", "644"],
    ["packaging/ai-crew-sync.env", "etc/ai-crew-sync/ai-crew-sync.env", "600"],
]
conf-files = ["/etc/ai-crew-sync/ai-crew-sync.env"]
maintainer-scripts = "packaging/debian"

[package.metadata.deb.systemd-units]
unit-name = "ai-crew-sync"
unit-scripts = "packaging"
# Installed but not started: the service cannot work until an operator puts a
# real DATABASE_URL in the environment file.
enable = false
start = false

[package.metadata.generate-rpm]
summary = "MCP coordination bus for a team's AI coding agents"
license = "MIT"
assets = [
    { source = "target/release/ai-crew-sync", dest = "/usr/bin/ai-crew-sync", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/ai-crew-sync/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/ai-crew-sync/LICENSE", mode = "644", doc = true },
    { source = "packaging/ai-crew-sync.service", dest = "/usr/lib/systemd/system/ai-crew-sync.service", mode = "644" },
    { source = "packaging/ai-crew-sync.env", dest = "/etc/ai-crew-sync/ai-crew-sync.env", mode = "640", config = "noreplace" },
]

# cargo-generate-rpm reads `post_install_script`, not a [scripts] table — the
# table form is silently ignored, which shipped an rpm whose service user was
# never created. Verified with `rpm -qp --scripts`.
post_install_script = """
getent group ai-crew-sync >/dev/null || groupadd --system ai-crew-sync
getent passwd ai-crew-sync >/dev/null || \
    useradd --system --gid ai-crew-sync --home-dir /nonexistent \
            --no-create-home --shell /sbin/nologin ai-crew-sync
# Readable by the service, by nobody else: it holds the database password.
chown root:ai-crew-sync /etc/ai-crew-sync/ai-crew-sync.env 2>/dev/null || true
chmod 640 /etc/ai-crew-sync/ai-crew-sync.env 2>/dev/null || true
systemctl daemon-reload >/dev/null 2>&1 || true
"""
