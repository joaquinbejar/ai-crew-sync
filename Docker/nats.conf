# The broker a deployment uses when a team is routed to JetStream.
#
# Off unless NATS_REPLICAS is set: a default installation never contacts a
# broker, and running one it never speaks to would be a lie about what the
# deployment is.
#
# max_payload is the reason this is a file rather than a flag. nats-server
# only accepts it in configuration, and its 1 MiB default refuses a 1 MiB
# body once envelope headers are added — by about two hundred bytes. Raising
# the stream's own max_message_size without this rejects exactly the messages
# the body contract allows.
max_payload: 2MB

# Where JetStream keeps the bodies. The service mounts a volume here, so a
# restart does not lose what the bus was told was stored.
jetstream {
    store_dir: /data
    # Ceilings for the node, under the per-team stream quotas the operator
    # sets with `team stream`. Both are deliberate: a broker with no limit is
    # an outage waiting for a quiet week.
    max_memory_store: 256MB
    max_file_store: 8GB
}

# Monitoring endpoint (/varz, /jsz). Published only if the operator maps it.
http_port: 8222
