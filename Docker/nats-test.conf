# JetStream fixture for `make test` (ADR 0001, phase 4).
#
# max_payload is the reason this is a file rather than a flag: nats-server
# only accepts it in configuration, and its 1 MiB default refuses a 1 MiB
# body once envelope headers are added — by about two hundred bytes. The
# adapter test measures that, so raising the stream's own max_message_size
# without this would fail exactly the messages the body contract allows.
max_payload: 2MB

jetstream {
    # Small on purpose: a fixture, not a deployment. The per-team stream
    # ceilings the tests set are smaller still.
    max_memory_store: 64MB
    max_file_store: 512MB
}
